
name: Crop ML Artifact Preservation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train crop recommendation model
        run: python train_model.py

      - name: Upload trained model artifact
        uses: actions/upload-artifact@v4
        with:
          name: crop-recommendation-model
          path: artifacts/crop_model.joblib
          if-no-files-found: error
          retention-days: 7
